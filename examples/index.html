<!doctype html>
<html lang="en">
  <head>
    <!-- @include head -->
    <title>Our Work: Website Examples | %name%</title>
    <meta name="description" content="Live websites we built, like The Set and YK Entertainment, plus sample sites for tree service, roofing, HVAC, plumbing and barbershops." />
    <link rel="canonical" href="https://%domain%/examples" />
    <meta property="og:title" content="Examples | %name%" />
    <meta property="og:description" content="Live websites we built, like The Set and YK Entertainment, plus sample sites for tree service, roofing, HVAC, plumbing and barbershops." />
    <meta property="og:url" content="https://%domain%/examples" />
  </head>
  <body>
    <!-- @include header -->
    <main>
      <section class="page-hero">
        <div class="wrap">
          <div class="eyebrow">Examples</div>
          <h1>Our work.</h1>
          <p class="lead">Live sites we built, plus sample sites for your trade. The best example is your own: we design a free mockup of your homepage before you pay anything.</p>
          <!-- @include hero-ctas -->
        </div>
      </section>
      <section class="ex-gallery">
        <div class="wrap">
          <div class="ex-search">
            <input type="search" id="ex-q" placeholder="Search your trade or city: roofer, barber, Atlanta…" aria-label="Search examples" autocomplete="off" />
            <div class="ex-chips" id="ex-chips"><button type="button" data-ind="" aria-pressed="true">All</button>
<!-- @industryChips -->
            </div>
          </div>
          <p class="muted ex-count" id="ex-count" aria-live="polite"></p>
          <div class="ex-grid" id="ex-grid">
<!-- @exampleTiles -->
          </div>
          <p class="ex-none" id="ex-none" hidden>No example for that yet. The best example is your own: <a href="/free-mockup">get a free mockup</a> of your homepage.</p>
        </div>
      </section>
      <!-- @include cta -->
    </main>
    <!-- @include footer -->
    <script type="module" src="/src/examples.js"></script>
  </body>
</html>
