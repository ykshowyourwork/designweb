<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Call list · %name%</title>
    <script>try{if(localStorage.getItem("desiweb-session"))document.documentElement.classList.add("signed")}catch(e){}</script>
    <link rel="stylesheet" href="/src/styles.css" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <style>
      .cl { padding: 24px 0 80px; }
      .cl h1 { font-size: clamp(2.4rem, 6vw, 4rem); margin-bottom: 4px; }
      .cl input, .cl select, .cl textarea { width: 100%; min-height: 44px; padding: 10px 12px; border-radius: 10px; border: 1.5px solid var(--line); background: var(--bg-2); color: var(--fg); font: inherit; font-size: 16px; }
      .cl textarea { min-height: 70px; line-height: 1.5; }
      .cl label { display: block; font-size: 13px; font-weight: 600; color: var(--muted); margin: 12px 0 6px; }
      .chips { display: flex; gap: 8px; overflow-x: auto; margin: 16px 0 12px; padding-bottom: 4px; }
      .chip { flex: none; border: 1.5px solid var(--line); background: transparent; color: var(--fg); border-radius: 999px; padding: 8px 14px; font: 600 14px/1 var(--body); cursor: pointer; }
      .chip.on { background: var(--brand); border-color: var(--brand); color: var(--brand-ink); }
      .b { display: inline-flex; align-items: center; justify-content: center; min-height: 44px; padding: 0 16px; border-radius: 999px; border: 1.5px solid var(--line); background: transparent; color: var(--fg); font: 700 14px/1 var(--body); cursor: pointer; text-decoration: none; white-space: nowrap; }
      .b.go { background: var(--brand); border-color: var(--brand); color: var(--brand-ink); }
      .b[disabled] { opacity: 0.5; cursor: default; }
      .net [hidden], .cl [hidden], #drawer[hidden], #drawer-bg[hidden] { display: none !important; }
      .card { padding: 16px 18px; margin-bottom: 14px; }
      .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0 14px; }
      @media (max-width: 600px) { .grid2 { grid-template-columns: 1fr; } }
      .toast { position: fixed; left: 16px; right: 16px; bottom: 16px; max-width: 520px; margin: 0 auto; background: #111; color: #fff; padding: 14px 18px; border-radius: 12px; font-weight: 600; box-shadow: 0 10px 30px rgba(0,0,0,.4); z-index: 50; }
    </style>
  </head>
  <body>
    <header class="top">
      <div class="wrap" style="display:flex;justify-content:space-between;align-items:center;min-height:64px">
        <a class="logo" href="/admin/calls"><!-- @logo --></a>
        <nav class="admin-nav"><button id="signout" class="linkish" hidden>Sign out</button></nav>
      </div>
    </header>
    <main class="wrap cl">
      <form id="login" class="narrow" style="padding:0">
        <h1>Call list</h1>
        <label for="email">Email</label>
        <input id="email" type="email" autocomplete="username" required />
        <label for="pw">Password</label>
        <input id="pw" type="password" autocomplete="current-password" required />
        <button class="b go" style="margin-top: 14px">Sign in</button>
        <p class="msg err" id="login-msg" role="alert"></p>
        <p style="margin-top:10px"><button type="button" class="linkish" id="forgot">Forgot password? Email me a link</button></p>
      </form>

      <div id="panel" hidden>
        <h1>Call list</h1>
        <p class="muted" id="summary"></p>
        <div class="chips" id="tabs"></div>
        <div style="display:flex;gap:10px;flex-wrap:wrap">
          <input id="search" placeholder="Search name, town, phone, trade…" style="flex:1;min-width:200px" />
          <button class="b" id="add-toggle">Add a lead</button>
        </div>
        <form id="add" class="card" style="margin-top:14px" hidden>
          <div class="grid2">
            <div><label>Business name</label><input name="business" required /></div>
            <div><label>Phone</label><input name="phone" type="tel" required /></div>
            <div><label>Owner or contact</label><input name="contact_name" /></div>
            <div><label>Town</label><input name="area" /></div>
            <div><label>Trade</label><input name="category" placeholder="Tree service" /></div>
          </div>
          <label>Notes</label><textarea name="notes"></textarea>
          <button class="b go" style="margin-top:12px">Add to the list</button>
        </form>
        <div id="list" style="margin-top:16px"><p class="muted">Loading…</p></div>
      </div>
    </main>
    <div class="toast" role="status" hidden></div>
    <script type="module" src="/src/calls.js"></script>
  </body>
</html>
