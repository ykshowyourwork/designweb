<style>
/* Layout: one phone-width app column, centered, with a fixed tab bar. Chalk-and-iron gym palette, cobalt for action, heat orange for effort, amber for food. */
:root {
  --bg: #eef0ec; --surface: #ffffff; --raised: #f7f8f5; --ink: #15171c; --muted: #646a73; --line: #dfe2dc;
  --accent: #2e5bff; --accent-soft: #e6ecff; --on-accent: #ffffff;
  --heat: #f2582c; --heat-soft: #ffe9e1; --food: #d88b16; --food-soft: #fdf1dc; --ok: #178a57; --ok-soft: #dff3e9; --warn: #b8670f;
  --display: "Big Shoulders Display", "Arial Narrow", Impact, sans-serif;
  --body: "Manrope", system-ui, -apple-system, "Segoe UI", sans-serif;
  --r: 18px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0d0f13; --surface: #171a20; --raised: #1d2128; --ink: #eceef2; --muted: #9aa1ab; --line: #2a2f37;
  --accent: #7891ff; --accent-soft: #1f2748; --on-accent: #0d0f13;
  --heat: #ff7a52; --heat-soft: #3a2017; --food: #f0b24d; --food-soft: #35290f; --ok: #3cc487; --ok-soft: #133024; --warn: #e9a04a; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0d0f13; --surface: #171a20; --raised: #1d2128; --ink: #eceef2; --muted: #9aa1ab; --line: #2a2f37;
  --accent: #7891ff; --accent-soft: #1f2748; --on-accent: #0d0f13;
  --heat: #ff7a52; --heat-soft: #3a2017; --food: #f0b24d; --food-soft: #35290f; --ok: #3cc487; --ok-soft: #133024; --warn: #e9a04a; color-scheme: dark }

* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 500 15px/1.5 var(--body); -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; cursor: pointer; }
input, select { font: inherit; color: var(--ink); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
h1, h2, h3 { margin: 0; text-wrap: balance; }
p { margin: 0; }
.num { font-variant-numeric: tabular-nums; }

.app { max-width: 440px; margin: 0 auto; min-height: 100%; position: relative; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 14px 110px; }
.proto-note { max-width: 440px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 10px 0; display: flex; gap: 8px; align-items: center; justify-content: space-between; color: var(--muted); font-size: 12px; }
.proto-note b { color: var(--ink); }
.linkbtn { background: none; border: 0; color: var(--accent); font-weight: 700; font-size: 12px; padding: 4px 0; }

.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
.eyebrow { text-transform: uppercase; letter-spacing: .14em; font-size: 11px; font-weight: 800; color: var(--muted); }
.title { font: 800 34px/0.95 var(--display); letter-spacing: .01em; text-transform: uppercase; }
.title.sm { font-size: 26px; }
.avatar { width: 38px; height: 38px; border-radius: 50%; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; font-weight: 800; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; }
.stack { display: grid; gap: 12px; }
.row { display: flex; gap: 10px; align-items: center; }
.between { justify-content: space-between; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.tiny { font-size: 11.5px; }

.btn { border: 0; border-radius: 999px; min-height: 46px; padding: 0 20px; font-weight: 800; letter-spacing: .02em; background: var(--raised); border: 1px solid var(--line); }
.btn.primary { background: var(--accent); color: var(--on-accent); border-color: transparent; }
.btn.block { width: 100%; }
.btn.ghost { background: transparent; }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 7px 13px; font-size: 13px; font-weight: 700; }
.chip.on { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.pill { display: inline-flex; align-items: center; gap: 6px; border-radius: 999px; padding: 3px 10px; font-size: 11.5px; font-weight: 800; background: var(--accent-soft); color: var(--accent); }
.pill.heat { background: var(--heat-soft); color: var(--heat); }
.pill.ok { background: var(--ok-soft); color: var(--ok); }
.pill.food { background: var(--food-soft); color: var(--food); }

/* Today hero */
.today { background: var(--ink); color: var(--bg); border: 0; position: relative; overflow: hidden; }
.today .eyebrow { color: color-mix(in srgb, var(--bg) 70%, transparent); }
.today .title { font-size: 44px; }
.today .meta { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 13px; opacity: .85; margin: 8px 0 14px; }
.today .stripe { position: absolute; right: -30px; top: -30px; width: 160px; height: 160px; border-radius: 50%; border: 22px solid var(--heat); opacity: .9; }
.today .btn.primary { background: var(--heat); color: #fff; }

.week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
.day { text-align: center; border-radius: 12px; padding: 8px 2px; background: var(--surface); border: 1px solid var(--line); font-size: 11px; font-weight: 700; }
.day b { display: block; font-size: 13px; }
.day.done { background: var(--ok-soft); border-color: transparent; color: var(--ok); }
.day.now { background: var(--accent); color: var(--on-accent); border-color: transparent; }
.day.rest { color: var(--muted); }

.phase { display: grid; grid-template-columns: repeat(12, 1fr); gap: 3px; margin-top: 10px; }
.phase span { height: 8px; border-radius: 3px; background: var(--line); }
.phase span.done { background: var(--accent); }
.phase span.now { background: var(--heat); }
.phase span.deload { background: repeating-linear-gradient(45deg, var(--line), var(--line) 3px, transparent 3px, transparent 6px); }
.phase span.deload.done { background: repeating-linear-gradient(45deg, var(--accent), var(--accent) 3px, transparent 3px, transparent 6px); }

/* Lists */
.list { display: grid; }
.item { display: flex; gap: 12px; align-items: center; padding: 12px 0; border-top: 1px solid var(--line); background: none; border-left: 0; border-right: 0; border-bottom: 0; width: 100%; text-align: left; }
.item:first-child { border-top: 0; }
.thumb { width: 52px; height: 52px; border-radius: 12px; flex: none; display: grid; place-items: center; font: 800 13px/1 var(--display); letter-spacing: .04em; color: var(--accent); background: var(--accent-soft); position: relative; overflow: hidden; text-transform: uppercase; }
.thumb::after { content: ""; position: absolute; right: 5px; bottom: 5px; border-left: 8px solid currentColor; border-top: 5px solid transparent; border-bottom: 5px solid transparent; opacity: .7; }
.thumb[data-img] { background-size: cover; background-position: center; color: transparent; border: 0; }
.thumb[data-img]::after { color: #fff; opacity: 1; filter: drop-shadow(0 0 3px rgba(0,0,0,.6)); right: 50%; bottom: 50%; transform: translate(50%, 50%); border-left-width: 12px; border-top-width: 8px; border-bottom-width: 8px; }
.player { position: relative; aspect-ratio: 16 / 9; max-width: 100%; border-radius: 14px; overflow: hidden; background: #000; }
.player.tall { aspect-ratio: 9 / 16; max-height: 62vh; margin: 0 auto; }
.player iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
.credit a { color: inherit; font-weight: 700; }
.item .grow { flex: 1; min-width: 0; }
.item .name { font-weight: 800; }
.item .sub { color: var(--muted); font-size: 12.5px; }

/* Workout logger */
.ex { padding: 14px; }
.ex-head { display: flex; gap: 12px; align-items: flex-start; }
.sets { display: grid; gap: 8px; margin-top: 12px; }
.set { display: grid; grid-template-columns: 26px 1fr 1fr auto; gap: 8px; align-items: center; }
.set .n { font: 800 18px/1 var(--display); color: var(--muted); text-align: center; }
.set input { width: 100%; min-width: 0; border: 1px solid var(--line); background: var(--raised); border-radius: 10px; padding: 8px 10px; font-weight: 800; }
.set label { font-size: 10px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); display: block; margin-bottom: 2px; }
.effort { display: flex; gap: 4px; }
.effort button { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 6px 6px; font-size: 10.5px; font-weight: 800; }
.effort button.on { background: var(--heat); border-color: var(--heat); color: #fff; }
.set.logged input { border-color: var(--ok); }
.last { font-size: 12px; color: var(--muted); }
.coachtip { margin-top: 10px; border-radius: 12px; padding: 10px 12px; font-size: 13px; font-weight: 700; background: var(--ok-soft); color: var(--ok); }
.coachtip.hold { background: var(--accent-soft); color: var(--accent); }
.coachtip.drop { background: var(--heat-soft); color: var(--heat); }

/* Sheets */
.scrim { position: fixed; inset: 0; background: rgba(8, 10, 14, .5); z-index: 40; display: flex; align-items: flex-end; justify-content: center; }
.sheet { background: var(--surface); width: 100%; max-width: 440px; border-radius: 22px 22px 0 0; padding: 18px max(16px, env(safe-area-inset-right, 0px)) calc(22px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); max-height: 88vh; overflow: auto; }
.grab-zone { position: relative; display: flex; justify-content: center; align-items: center; min-height: 34px; margin: -10px 0 6px; touch-action: none; cursor: grab; }
.grab-zone:active { cursor: grabbing; }
.grab { width: 44px; height: 5px; border-radius: 3px; background: var(--muted); opacity: .5; }
.sheet-x { position: absolute; right: 0; top: 0; width: 34px; height: 34px; border-radius: 50%; border: 1px solid var(--line); background: var(--raised); font-size: 18px; line-height: 1; display: grid; place-items: center; }
.sheet { animation: sheetIn .22s ease-out; will-change: transform; }
@keyframes sheetIn { from { transform: translateY(40%); opacity: .4; } to { transform: none; opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .sheet { animation: none; } }
.video { display: flex; gap: 12px; align-items: center; border-radius: 14px; background: var(--ink); color: var(--bg); padding: 14px; text-decoration: none; }
.video .play { width: 46px; height: 46px; border-radius: 50%; background: var(--heat); display: grid; place-items: center; flex: none; }
.video .play::before { content: ""; border-left: 14px solid #fff; border-top: 9px solid transparent; border-bottom: 9px solid transparent; margin-left: 4px; }
.video .vt { font-weight: 800; font-size: 13.5px; }
.video .vc { font-size: 12px; opacity: .75; }
.chain { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; font-size: 12.5px; }
.chain .lv { border: 1px solid var(--line); border-radius: 999px; padding: 4px 10px; font-weight: 700; background: var(--raised); }
.chain .lv.me { background: var(--accent); color: var(--on-accent); border-color: transparent; }
.cues { margin: 0; padding-left: 18px; display: grid; gap: 4px; }

/* Tabs */
.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; background: color-mix(in srgb, var(--surface) 92%, transparent); backdrop-filter: blur(10px); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); }
.tabs .in { max-width: 440px; margin: 0 auto; display: grid; grid-template-columns: repeat(5, 1fr); padding-left: max(8px, env(safe-area-inset-left, 0px)); padding-right: max(8px, env(safe-area-inset-right, 0px)); }
.tabs button { background: none; border: 0; padding: 10px 0 12px; font-size: 11px; font-weight: 800; color: var(--muted); display: grid; justify-items: center; gap: 4px; }
.tabs button svg { width: 22px; height: 22px; }
.tabs button.on { color: var(--accent); }

/* Rings and charts */
.rings { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.ring { text-align: center; font-size: 11.5px; font-weight: 700; color: var(--muted); }
.ring svg { width: 100%; max-width: 76px; height: auto; display: block; margin: 0 auto 4px; }
.ring b { display: block; color: var(--ink); font-size: 13px; }
.chart { width: 100%; height: auto; display: block; }
.stat { display: grid; gap: 2px; }
.stat .v { font: 800 30px/1 var(--display); }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }

/* Onboarding */
.q { display: grid; gap: 8px; padding: 12px 0; border-top: 1px solid var(--line); }
.q:first-of-type { border-top: 0; }
.yn { display: flex; gap: 8px; }
.yn button { flex: 1; border: 1px solid var(--line); background: var(--raised); border-radius: 10px; padding: 9px; font-weight: 800; }
.yn button.on.no { background: var(--ok); border-color: var(--ok); color: #fff; }
.yn button.on.yes { background: var(--heat); border-color: var(--heat); color: #fff; }
.steps { display: flex; gap: 4px; margin: 4px 0 14px; }
.steps span { flex: 1; height: 5px; border-radius: 3px; background: var(--line); }
.steps span.on { background: var(--accent); }
.field { display: grid; gap: 6px; }
.field > span { font-size: 12px; font-weight: 800; color: var(--muted); letter-spacing: .04em; }
.field input, .field select { border: 1px solid var(--line); background: var(--raised); border-radius: 12px; padding: 11px 12px; font-weight: 700; width: 100%; }
.alert { border-radius: 14px; padding: 12px 14px; background: var(--heat-soft); color: var(--heat); font-weight: 700; font-size: 13.5px; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(86px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 999px; font-weight: 800; font-size: 13px; z-index: 60; }
.tier { border: 1px solid var(--line); border-radius: 16px; padding: 14px; display: grid; gap: 6px; background: var(--surface); }
.tier.on { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); }
.msg { background: var(--raised); border-radius: 14px 14px 14px 4px; padding: 10px 12px; font-size: 14px; }
.msg.me { background: var(--accent); color: var(--on-accent); border-radius: 14px 14px 4px 14px; justify-self: end; }
.scan { border-radius: 18px; background: var(--ink); color: var(--bg); aspect-ratio: 4 / 3; max-width: 100%; display: grid; place-items: center; position: relative; overflow: hidden; }
.scan .frame { width: 70%; height: 38%; border: 3px solid var(--food); border-radius: 12px; position: relative; }
.scan .laser { position: absolute; left: 6%; right: 6%; height: 2px; background: var(--heat); top: 50%; box-shadow: 0 0 12px var(--heat); animation: laser 1.6s ease-in-out infinite alternate; }
@keyframes laser { from { top: 15%; } to { top: 85%; } }
.credit { font-size: 11px; color: var(--muted); }
@media (prefers-reduced-motion: reduce) { .scan .laser { animation: none; } }
</style>

</head>

<div class="proto-note"><span><b>Prototype</b> · example member, sample data</span><button class="linkbtn" id="restart" type="button">Try sign-up</button></div>
<main class="app" id="app" aria-live="polite"><p class="muted">Loading the exercise library…</p></main>
<nav class="tabs" id="tabs" aria-label="Main"><div class="in"></div></nav>
<div id="layer"></div>

<script>
// ---------- Rules (from data/rules.json, the parts the prototype runs) ----------
const RULES = {
  parq: [
    "Has your doctor ever said that you have a heart condition OR high blood pressure?",
    "Do you feel pain in your chest at rest, during your daily activities of living, OR when you do physical activity?",
    "Do you lose balance because of dizziness OR have you lost consciousness in the last 12 months?",
    "Have you ever been diagnosed with another chronic medical condition (other than heart disease or high blood pressure)?",
    "Are you currently taking prescribed medications for a chronic medical condition?",
    "Do you currently have (or have had within the past 12 months) a bone, joint, or soft tissue problem that could be made worse by becoming more physically active?",
    "Has your doctor ever said that you should only do medically supervised physical activity?"
  ],
  goals: {
    muscle_gain:    { label: "Muscle gain",    sets: 4, reps: [8, 12], rir: [1, 3], rest: "60–120 s", tempo: "2-0-2", kcal: +350, protein: [1.6, 2.0], fat: 0.25, pace: "+1–2 lb a month" },
    weight_loss:    { label: "Weight loss",    sets: 3, reps: [8, 15], rir: [2, 3], rest: "30–90 s",  tempo: "2-0-2", kcal: -400, protein: [2.0, 2.2], fat: 0.30, pace: "−1–2 lb a week" },
    performance:    { label: "Performance",    sets: 4, reps: [3, 5],  rir: [1, 3], rest: "2–5 min",  tempo: "Explosive", kcal: +150, protein: [1.6, 2.0], fat: 0.25, pace: "Test scores up each block" },
    general_health: { label: "General health", sets: 3, reps: [8, 15], rir: [2, 4], rest: "60–90 s",  tempo: "2-0-2", kcal: 0, protein: [1.2, 1.6], fat: 0.30, pace: "Test scores up each block" },
    foundation:     { label: "Foundation",     sets: 2, reps: [12, 20], rir: [3, 4], rest: "0–90 s", tempo: "4-2-1 (slow)" }
  },
  splits: {
    muscle_gain:    { 2: ["full_a","full_b"], 3: ["full_a","full_b","full_c"], 4: ["upper_a","lower_a","upper_b","lower_b"], 5: ["upper_a","lower_a","push","pull","legs"], 6: ["push","pull","legs","push","pull","legs"] },
    weight_loss:    { 2: ["full_a","full_b"], 3: ["full_a","full_b","full_c"], 4: ["full_a","conditioning","full_b","conditioning"], 5: ["upper_a","lower_a","conditioning","full_a","cardio"], 6: ["upper_a","lower_a","conditioning","upper_b","lower_b","cardio"] },
    general_health: { 2: ["full_a","full_b"], 3: ["full_a","full_b","full_c"], 4: ["full_a","conditioning","full_b","conditioning"], 5: ["upper_a","lower_a","conditioning","full_a","cardio"], 6: ["upper_a","lower_a","conditioning","upper_b","lower_b","cardio"] },
    performance:    { 2: ["full_a","full_b"], 3: ["full_a","speed_agility","full_b"], 4: ["lower_a","upper_a","speed_agility","full_a"], 5: ["lower_a","upper_a","speed_agility","full_a","conditioning"], 6: ["upper_a","lower_a","push","pull","legs","speed_agility"] }
  },
  playlists: {
    full_a: ["squat","push_horizontal","pull_vertical","hinge","core","carry"],
    full_b: ["hinge","push_vertical","pull_horizontal","lunge","core","iso:biceps"],
    full_c: ["lunge","push_horizontal","pull_horizontal","squat","core","plyo_agility"],
    upper_a: ["push_horizontal","pull_horizontal","push_vertical","pull_vertical","iso:biceps","iso:triceps","core"],
    upper_b: ["push_vertical","pull_vertical","push_horizontal","pull_horizontal","iso:side delts","iso:rear delts","core"],
    lower_a: ["squat","hinge","lunge","iso:hamstrings","iso:calves","core"],
    lower_b: ["hinge","lunge","squat","iso:quads","iso:calves","core"],
    push: ["push_horizontal","push_vertical","push_horizontal","iso:side delts","iso:triceps","iso:triceps"],
    pull: ["pull_vertical","pull_horizontal","pull_horizontal","iso:rear delts","iso:biceps","core"],
    legs: ["squat","hinge","lunge","iso:quads","iso:hamstrings","iso:calves"],
    speed_agility: ["warmup_mobility","plyo_agility","plyo_agility","plyo_agility","core"],
    conditioning: ["squat","push_horizontal","pull_horizontal","lunge","carry"],
    cardio: ["cardio","cardio"]
  },
  names: { full_a: "Full Body A", full_b: "Full Body B", full_c: "Full Body C", upper_a: "Upper A", upper_b: "Upper B", lower_a: "Lower A", lower_b: "Lower B", push: "Push", pull: "Pull", legs: "Legs", speed_agility: "Speed + Agility", conditioning: "Conditioning", cardio: "Cardio" },
  slotsForMinutes: { 30: 4, 45: 6, 60: 99, 75: 99 },
  squatFix: { knees_cave: ["banded-lateral-walk","glute-bridge"], heels_lift: ["foam-roll-calves","standing-calf-raise"], arms_fall: ["foam-roll-upper-back","band-pull-apart"], forward_lean: ["half-kneeling-hip-flexor-stretch","front-plank"], low_back_arch: ["dead-bug","half-kneeling-hip-flexor-stretch"] },
  equipment: {
    full_gym: ["bodyweight","dumbbell","barbell","kettlebell","band","cable","machine","suspension","medicine_ball","bench","box","pullup_bar","foam_roller"],
    home: ["bodyweight","dumbbell","band","bench","box","foam_roller","kettlebell"],
    bodyweight: ["bodyweight","box","band","foam_roller"]
  }
};
const LEVEL = { push: [[0,1],[5,2],[15,3],[30,4]], pull: [[0,1],[5,2],[12,3],[20,4]], legs: [[0,1],[15,2],[30,3],[50,4]], core: [[0,1],[30,2],[60,3],[120,4]] };
const levelFor = (k, v) => LEVEL[k].reduce((lv, [min, l]) => (v >= min ? l : lv), 1);
const groupOf = (p) => p.startsWith("push") ? "push" : p.startsWith("pull") ? "pull" : ["squat","hinge","lunge"].includes(p) ? "legs" : p === "core" ? "core" : "legs";

// ---------- State ----------
const SAMPLE = {
  onboarded: true,
  profile: { name: "Maya", sex: "female", age: 29, cm: 165, kg: 66, goal: "muscle_gain", weeks: 12, days: 4, minutes: 60, equip: "full_gym", status: "6_to_24_months", activity: 1.55 },
  parq: [false,false,false,false,false,false,false],
  test: { push: 12, pull: 8, legs: 34, core: 70, rhr: 62, squat: ["knees_cave"] },
  block: 1, week: 2, todayIndex: 1,

let S = load() || structuredClone(SAMPLE);
function load() { try { const v = localStorage.getItem("pf-proto"); return v ? JSON.parse(v) : null; } catch { return null; } }

let EX = [], BY = {}, tab = "today", onb = null;
const $ = (s, el = document) => el.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const initials = (n) => n.split(/\s|-/).filter(Boolean).slice(0, 2).map((w) => w[0]).join("");

// ---------- Engine ----------
function levels() { const t = S.test; return { push: levelFor("push", t.push), pull: levelFor("pull", t.pull), legs: levelFor("legs", t.legs), core: levelFor("core", t.core) }; }
function inFoundation() { const lv = levels(); return S.parq.some(Boolean) || ["never","under_6_months"].includes(S.profile.status) || Object.values(lv).includes(1); }
function goalTable() { return inFoundation() && S.week <= 2 && S.block === 1 ? RULES.goals.foundation : RULES.goals[S.profile.goal]; }
function fits(e) { const ok = RULES.equipment[S.profile.equip]; return e.equipment.every((q) => ok.includes(q)) && !S.hidden.includes(e.id); }
function pick(slot, used, dayKey) {
  const lv = levels();
  let pool;
  if (slot.startsWith("iso:")) { const m = slot.slice(4); pool = EX.filter((e) => e.pattern === "isolation" && e.muscles_primary.includes(m)); }
  else pool = EX.filter((e) => e.pattern === slot);
  pool = pool.filter((e) => fits(e) && !used.has(e.id));
  if (!pool.length) return null;
  const cap = slot.startsWith("iso:") ? 5 : (lv[groupOf(slot)] || 2) + (S.block - 1);
  const allSaved = new Set(Object.values(S.saved).flat());
  const scored = pool.map((e) => ({ e, s: (e.level <= cap ? 10 - (cap - e.level) : -5) + (allSaved.has(e.id) ? 2 : 0) + ((hash(dayKey + e.id + S.block) % 7) / 10) }));

}
function hash(s) { let h = 0; for (const c of s) h = (h * 31 + c.charCodeAt(0)) >>> 0; return h; }
function buildDay(key) {
  const used = new Set(), slots = RULES.playlists[key].slice(0, RULES.slotsForMinutes[S.profile.minutes]);
  const items = slots.map((sl) => { const e = pick(sl, used, key); if (e) used.add(e.id); return e; }).filter(Boolean);
  const g = goalTable();
  return { key, name: RULES.names[key], items: items.map((e) => ({ id: e.id, sets: e.pattern === "core" || e.pattern === "carry" ? Math.min(3, g.sets) : g.sets, reps: e.pattern === "plyo_agility" ? [3, 6] : e.pattern === "isolation" ? [Math.max(10, g.reps[0]), Math.max(15, g.reps[1])] : g.reps })) };
}
function warmup() { const ids = (S.test.squat || []).flatMap((k) => RULES.squatFix[k] || []); return [...new Set(ids)].map((id) => BY[id]).filter(Boolean); }
function schedule() { return RULES.splits[S.profile.goal][S.profile.days]; }
function targets() {
  const p = S.profile, g = RULES.goals[p.goal];

  const tdee = bmr * p.activity;
  let kcal = Math.round((tdee + g.kcal) / 10) * 10;
  if (p.goal === "weight_loss") kcal = Math.max(kcal, p.sex === "male" ? 1500 : 1200);
  const protein = Math.round(p.kg * ((g.protein[0] + g.protein[1]) / 2));
  const fat = Math.round((kcal * g.fat) / 9);
  const carbs = Math.round((kcal - protein * 4 - fat * 9) / 4);

}
function hrZones() { const max = 208 - 0.7 * S.profile.age, r = S.test.rhr; const z = (p) => Math.round((max - r) * p + r); return { 2: [z(.6), z(.7)], 4: [z(.8), z(.9)], max: Math.round(max) }; }

function lastTime(id) { // sample history so double progression has something to work from
  const e = BY[id]; if (!e) return null;
  const base = { barbell: 95, dumbbell: 25, kettlebell: 35, machine: 70, cable: 40 }[e.equipment.find((q) => ["barbell","dumbbell","kettlebell","machine","cable"].includes(q))] || 0;

}
function verdict(id, rows, range) {
  const logged = rows.filter((r) => r.reps && r.effort);
  if (!logged.length) return null;
  const allTop = logged.length === rows.length && logged.every((r) => +r.reps >= range[1] && ["easy","good"].includes(r.effort));

}

function spark(points, w = 320, h = 120, color = "var(--accent)", goal = null) {
  const min = Math.min(...points, goal ?? Infinity) - 2, max = Math.max(...points, goal ?? -Infinity) + 2;

  const d = points.map((v, i) => `${i ? "L" : "M"}${x(i).toFixed(1)},${y(v).toFixed(1)}`).join("");
  const area = `${d}L${x(points.length - 1)},${h - 20}L${x(0)},${h - 20}Z`;
  const grid = [min + 2, (min + max) / 2, max - 2].map((v) => `<line x1="28" x2="${w - 12}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="0" y="${y(v) + 4}" font-size="10" fill="var(--muted)">${Math.round(v)}</text>`).join("");
  const labels = points.map((_, i) => (i % 2 === 0 || i === points.length - 1) ? `<text x="${x(i)}" y="${h - 4}" font-size="10" text-anchor="middle" fill="var(--muted)">W${i + 1}</text>` : "").join("");
  return `<svg class="chart" viewBox="0 0 ${w} ${h}" role="img">${grid}${goal != null ? `<line x1="28" x2="${w - 12}" y1="${y(goal)}" y2="${y(goal)}" stroke="var(--ok)" stroke-dasharray="4 4"/>` : ""}<path d="${area}" fill="${color}" opacity=".12"/><path d="${d}" fill="none" stroke="${color}" stroke-width="2.5" stroke-linejoin="round"/><circle cx="${x(points.length - 1)}" cy="${y(points[points.length - 1])}" r="4.5" fill="${color}"/>${labels}</svg>`;
}

function sheet(html) {
  $("#layer").innerHTML = `<div class="scrim" data-close><div class="sheet" role="dialog" aria-modal="true"><div class="grab-zone" title="Drag down to close"><span class="grab"></span><button class="sheet-x" type="button" data-x aria-label="Close">×</button></div>${html}</div></div>`;
  const sh = $(".sheet"), zone = $(".grab-zone", sh); let y0 = null, dy = 0, t0 = 0;
  zone.addEventListener("pointerdown", (e) => { if (e.target.closest(".sheet-x")) return; y0 = e.clientY; dy = 0; t0 = Date.now(); sh.style.transition = "none"; zone.setPointerCapture(e.pointerId); });
  zone.addEventListener("pointermove", (e) => { if (y0 === null) return; dy = Math.max(0, e.clientY - y0); sh.style.transform = `translateY(${dy}px)`; });
  const end = () => { if (y0 === null) return; const fast = dy > 40 && dy / Math.max(1, Date.now() - t0) > 0.5; sh.style.transition = "transform .2s ease"; if (dy > 110 || fast) { sh.style.transform = "translateY(110%)"; setTimeout(closeSheet, 190); } else sh.style.transform = ""; y0 = null; };
  zone.addEventListener("pointerup", end); zone.addEventListener("pointercancel", end);
}

  ["Peanut butter, 2 tbsp",190,8,7,16],["Almonds, 1 oz",164,6,6,14],["Olive oil, 1 tbsp",119,0,0,14],["Granola, 1/4 cup",140,3,20,5],["Protein bar",200,20,22,7],["Black beans, 1/2 cup",114,8,20,0],["Hummus, 2 tbsp",70,2,4,5]
];
function foodResults(q) { q = q.trim().toLowerCase(); const words = q.split(/\s+/).filter(Boolean); const hits = FOODS.filter((f) => words.every((w) => f[0].toLowerCase().includes(w))); return hits; }
function renderFoodResults() {
  const q = $("#fs")?.value || "", hits = foodResults(q), box = $("#fs-results"); if (!box) return;
  box.innerHTML = hits.length ? hits.slice(0, 12).map((f) => `<button class="item" type="button" data-food="${FOODS.indexOf(f)}"><span class="grow"><span class="name" style="font-weight:700">${esc(f[0])}</span><br><span class="sub num">P ${f[2]} · C ${f[3]} · F ${f[4]}</span></span><span class="num small">${f[1]}</span><span class="pill">Add</span></button>`).join("") : `<p class="small muted" style="padding:12px 0">No match for "${esc(q)}" in the sample list. With FatSecret connected, search covers over a million foods.</p>`;
}
function searchSheet() {
  sheet(`<h2 class="title sm">Search food</h2><label class="field" style="margin-top:10px"><span>Food name</span><input id="fs" type="search" placeholder="e.g. eggs, rice, salmon" autocomplete="off"></label><div class="list" id="fs-results" style="margin-top:8px"></div><p class="credit" style="margin-top:8px">Powered by fatsecret · sample foods until the API is connected</p>`);
  renderFoodResults(); setTimeout(() => $("#fs")?.focus(), 50);
}
function toast(t) { const d = document.createElement("div"); d.className = "toast"; d.setAttribute("role", "status"); d.textContent = t; document.body.append(d); setTimeout(() => d.remove(), 2200); }

// ---------- Events ----------
document.addEventListener("click", (ev) => {
  const b = ev.target.closest("button, a, [data-close]"); if (!b) return;
  const d = b.dataset;
  if (d.close !== undefined && ev.target === b) return closeSheet();
  if (d.x !== undefined) return closeSheet();
  if (d.tab) { tab = d.tab; closeSheet(); return render(); }
  if (d.go) { tab = d.go; return render(); }
  if (d.ex) return exSheet(d.ex);
  if (d.save) return saveSheet(d.save);
  if (d.saveto) { const [n, id] = d.saveto.split("|"); const l = S.saved[n]; l.includes(id) ? l.splice(l.indexOf(id), 1) : l.push(id); save(); saveSheet(id); return toast(l.includes(id) ? `Saved to ${n}` : `Removed from ${n}`); }
  if (d.savetoNew) { const n = ($("#newpl").value || "").trim(); if (!n) return $("#newpl").focus(); S.saved[n] ||= []; S.saved[n].push(d.savetoNew); save(); saveSheet(d.savetoNew); return toast(`Saved to ${n}`); }
  if (d.hide) { S.hidden.push(d.hide); save(); closeSheet(); render(); return toast("Got it. You won't see that one again."); }
  if (d.filter) { renderPlaylists.filter = d.filter; return renderPlaylists(); }
  if (d.pl) { const day = buildDay(d.pl); return playlistSheet(`Block ${S.block} · ${day.name}`, day.items.map((x) => x.id), "Built from your goal, level and equipment."); }
  if (d.mypl) return playlistSheet(d.mypl, S.saved[d.mypl], "Your playlist. Run it any day as a workout.");
  if (d.newpl !== undefined) { const n = `My playlist ${Object.keys(S.saved).length + 1}`; S.saved[n] = []; save(); renderPlaylists(); return toast(`Created "${n}". Tap Save on any exercise to add it.`); }
  if (d.eff) { const [id, n, k] = d.eff.split(":"); const key = logKeyNow(); const r = S.log[key][id][+n]; r.effort = k; if (!r.reps) r.reps = String(buildRange(id)[1]); save(); return rerenderCard(id); }
  if (d.finish !== undefined) { S.todayIndex++; if (S.todayIndex % S.profile.days === 0) { S.week++; if (S.week > 4) { S.week = 1; S.block++; } } save(); tab = "today"; render(); return toast("Workout saved. Next session's weights are set."); }
  if (d.toast) return toast(d.toast);
  if (d.tier) { S.tier = d.tier; save(); renderCoach(); return toast("Plan switched (prototype)"); }
  if (d.scan !== undefined) return scanSheet();
  if (d.scanned !== undefined) return scannedSheet();
  if (d.search !== undefined) return searchSheet();
  if (d.food) return foodSheet(FOODS[+d.food], "Add food");
  if (d.serv) { const dir = +d.serv, cur = FOOD_PICK.servings, step = cur < 1 || (cur === 1 && dir < 0) ? 0.5 : 1; FOOD_PICK.servings = Math.max(0.5, cur + dir * step); return drawFoodMacros(); }
  if (d.addfood !== undefined) { const m = $(".sheet [data-pick=meal] .on")?.textContent || "Snack"; const { f, servings: k } = FOOD_PICK; S.food ||= structuredClone(SAMPLE_MEALS); let meal = S.food.find((x) => x.meal === m); if (!meal) S.food.push((meal = { meal: m, items: [] })); meal.items.push([`${f[0]}${k !== 1 ? ` × ${k}` : ""}`, Math.round(f[1] * k), Math.round(f[2] * k), Math.round(f[3] * k), Math.round(f[4] * k)]); save(); closeSheet(); tab = "food"; render(); return toast(`Added to ${m}`); }
  if (b.closest("[data-pick]")) { b.parentElement.querySelectorAll(".chip").forEach((c) => c.classList.remove("on")); b.classList.add("on"); return; }
  // onboarding
  if (d.parq) { const [i, y] = d.parq.split(":"); onb.parq[+i] = y === "1"; return renderOnboarding(); }
  if (d.p) { readOnbFields(); const [k, v] = d.p.split(":"); onb.profile[k] = isNaN(+v) ? v : +v; return renderOnboarding(); }
  if (d.sq) { readOnbFields(); const s = onb.test.squat; s.includes(d.sq) ? s.splice(s.indexOf(d.sq), 1) : s.push(d.sq); return renderOnboarding(); }
  if (d.next !== undefined) { readOnbFields(); onb.step++; window.scrollTo({ top: 0 }); return renderOnboarding(); }
  if (d.done !== undefined) { S = { ...structuredClone(SAMPLE), onboarded: true, profile: onb.profile, parq: onb.parq, test: onb.test, block: 1, week: 1, todayIndex: 0, saved: { "Saved": [] }, log: {}, food: null }; onb = null; save(); tab = "today"; render(); return toast("Program built. Week 1 starts today."); }
});
document.addEventListener("input", (ev) => {
  const el = ev.target, d = el.dataset;
  if (el.id === "fs") return renderFoodResults();
  if (d.w || d.r) { const [id, n] = (d.w || d.r).split(":"); const row = S.log[logKeyNow()][id][+n]; d.w ? (row.w = el.value) : (row.reps = el.value); save(); }
});
document.addEventListener("change", (ev) => { const d = ev.target.dataset; if (d.w || d.r) rerenderCard((d.w || d.r).split(":")[0]); });
function logKeyNow() { const sch = schedule(); return `${S.block}-${S.week}-${sch[S.todayIndex % sch.length]}`; }
function buildRange(id) { const sch = schedule(), day = buildDay(sch[S.todayIndex % sch.length]); return day.items.find((x) => x.id === id)?.reps || [8, 12]; }
function rerenderCard(id) {
  const sch = schedule(), day = buildDay(sch[S.todayIndex % sch.length]); const i = day.items.findIndex((x) => x.id === id); if (i < 0) return;
  const old = document.querySelector(`[data-card="${id}"]`); if (!old) return;
  const tmp = document.createElement("div"); tmp.innerHTML = exCard(day.items[i], i, logKeyNow()); old.replaceWith(tmp.firstElementChild);
}
$("#restart").addEventListener("click", () => {
  closeSheet();
  onb = { step: 0, parq: [null,null,null,null,null,null,null], profile: { name: "", sex: "female", age: 30, cm: 168, kg: 68, goal: "muscle_gain", weeks: 12, days: 3, minutes: 45, equip: "full_gym", status: "under_6_months", activity: 1.55 }, test: { push: 8, pull: 6, legs: 25, core: 45, rhr: 66, squat: [] } };
  S = { ...S, onboarded: false }; render();
});
document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeSheet(); });

// ---------- Boot ----------
const VIEWS = ["today", "workout", "playlists", "progress", "food", "coach"];
function fromHash() { const h = location.hash.slice(1); if (VIEWS.includes(h) && S.onboarded) { tab = h; closeSheet(); render(); } }
window.addEventListener("hashchange", fromHash);
fetch("exercises.json").then((r) => r.json()).then((d) => { EX = d; BY = Object.fromEntries(d.map((e) => [e.id, e])); if (!S.onboarded && !onb) S = structuredClone(SAMPLE); const h = location.hash.slice(1); if (VIEWS.includes(h)) tab = h; render(); })
  .catch(() => { $("#app").innerHTML = `<p class="alert">The exercise library didn't load. Reload the page to try again.</p>`; });
</script>
