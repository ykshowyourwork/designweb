<style>
/* Layout: one phone-width app column, centered, with a fixed tab bar. Elite Fitness JR brand: black, logo gold #F69F00, logo grey #A6A6A6. */
:root {
  --bg: #f3f3f1; --surface: #ffffff; --raised: #f7f7f5; --ink: #0d0d0d; --muted: #5f6166; --line: #e0e0dc;
  --accent: #f69f00; --accent-ink: #9a5d00; --accent-soft: #fff1d6; --on-accent: #0d0d0d;
  --hero: #0d0d0d; --on-hero: #ffffff; --brand-grey: #a6a6a6;
  --heat: #d6371f; --heat-soft: #fde6e1; --food: #5c6470; --food-soft: #eceef1; --ok: #178a57; --ok-soft: #dff3e9; --warn: #b8670f;
  --display: "Montserrat", "Arial Black", system-ui, sans-serif;
  --body: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --r: 18px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0a0a0a; --surface: #151515; --raised: #1d1d1d; --ink: #f2f2f2; --muted: #a6a6a6; --line: #2b2b2b;
  --accent: #f69f00; --accent-ink: #ffb733; --accent-soft: #2e2005; --on-accent: #0a0a0a;
  --hero: #000000; --on-hero: #ffffff;
  --heat: #ff6a4d; --heat-soft: #3a1a13; --food: #b8bec7; --food-soft: #24272c; --ok: #3cc487; --ok-soft: #133024; --warn: #e9a04a; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0a0a0a; --surface: #151515; --raised: #1d1d1d; --ink: #f2f2f2; --muted: #a6a6a6; --line: #2b2b2b;
  --accent: #f69f00; --accent-ink: #ffb733; --accent-soft: #2e2005; --on-accent: #0a0a0a;
  --hero: #000000; --on-hero: #ffffff;
  --heat: #ff6a4d; --heat-soft: #3a1a13; --food: #b8bec7; --food-soft: #24272c; --ok: #3cc487; --ok-soft: #133024; --warn: #e9a04a; color-scheme: dark }

* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 500 15px/1.5 var(--body); -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; cursor: pointer; }
input, select { font: inherit; color: var(--ink); }
:focus-visible { outline: 2px solid var(--accent-ink); outline-offset: 2px; }
h1, h2, h3 { margin: 0; text-wrap: balance; }
p { margin: 0; }
.num { font-variant-numeric: tabular-nums; }

.app { max-width: 440px; margin: 0 auto; min-height: 100%; position: relative; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 14px 110px; }
.proto-note { max-width: 440px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 10px 0; display: flex; gap: 8px; align-items: center; justify-content: space-between; color: var(--muted); font-size: 12px; }
.proto-note b { color: var(--ink); }
.brandbar { max-width: 440px; margin: 0 auto; padding: 10px max(16px, env(safe-area-inset-right, 0px)) 0 max(16px, env(safe-area-inset-left, 0px)); display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.brand { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--ink); }
.brand img { width: 40px; height: 40px; border-radius: 11px; background: #000; display: block; }
.brand .wm { font: 900 16px/1 var(--display); letter-spacing: .02em; text-transform: uppercase; }
.brand .wm em { font-style: normal; color: var(--accent-ink); }
.brand .wm small { display: block; font: 600 9.5px/1.4 var(--display); letter-spacing: .32em; color: var(--muted); margin-top: 2px; }

.linkbtn { background: none; border: 0; color: var(--accent-ink); font-weight: 700; font-size: 12px; padding: 4px 0; }

.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
.eyebrow { text-transform: uppercase; letter-spacing: .14em; font-size: 11px; font-weight: 800; color: var(--muted); }
.title { font: 900 28px/1.02 var(--display); letter-spacing: -.01em; text-transform: uppercase; }
.title.sm { font-size: 21px; }
.avatar { width: 38px; height: 38px; border-radius: 50%; background: var(--accent-soft); color: var(--accent-ink); display: grid; place-items: center; font-weight: 800; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; }
.stack { display: grid; gap: 12px; }
.row { display: flex; gap: 10px; align-items: center; }
.between { justify-content: space-between; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.tiny { font-size: 11.5px; }

.btn { border: 0; border-radius: 999px; min-height: 46px; padding: 0 20px; font-weight: 800; letter-spacing: .04em; text-transform: uppercase; font-size: 13.5px; font-family: var(--display); background: var(--raised); border: 1px solid var(--line); }
.btn.primary { background: var(--accent); color: var(--on-accent); border-color: transparent; }
.btn.block { width: 100%; }
.btn.ghost { background: transparent; }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 7px 13px; font-size: 13px; font-weight: 700; }
.chip.on { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.pill { display: inline-flex; align-items: center; gap: 6px; border-radius: 999px; padding: 3px 10px; font-size: 11.5px; font-weight: 800; background: var(--accent-soft); color: var(--accent-ink); }
.pill.heat { background: var(--heat-soft); color: var(--heat); }
.pill.ok { background: var(--ok-soft); color: var(--ok); }
.pill.food { background: var(--food-soft); color: var(--food); }

/* Today hero */
.today { background: var(--hero); color: var(--on-hero); border: 1px solid var(--line); position: relative; overflow: hidden; }
.today .eyebrow { color: var(--accent); }
.today .title { font-size: 34px; }
.today .meta { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 13px; opacity: .85; margin: 8px 0 14px; }
.today .stripe { position: absolute; right: -30px; top: -30px; width: 160px; height: 160px; border-radius: 50%; border: 22px solid var(--accent); opacity: .9; }
.today .btn.primary { background: var(--accent); color: #0d0d0d; }

.week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
.day { text-align: center; border-radius: 12px; padding: 8px 2px; background: var(--surface); border: 1px solid var(--line); font-size: 11px; font-weight: 700; }
.day b { display: block; font-size: 13px; }
.day.done { background: var(--ok-soft); border-color: transparent; color: var(--ok); }
.day.now { background: var(--accent); color: var(--on-accent); border-color: transparent; }
.day.rest { color: var(--muted); }

.phase { display: grid; grid-template-columns: repeat(12, 1fr); gap: 3px; margin-top: 10px; }
.phase span { height: 8px; border-radius: 3px; background: var(--line); }
.phase span.done { background: var(--accent); }
.phase span.now { background: var(--heat); }
.phase span.deload { background: repeating-linear-gradient(45deg, var(--line), var(--line) 3px, transparent 3px, transparent 6px); }
.phase span.deload.done { background: repeating-linear-gradient(45deg, var(--accent), var(--accent) 3px, transparent 3px, transparent 6px); }

/* Lists */
.list { display: grid; }
.item { display: flex; gap: 12px; align-items: center; padding: 12px 0; border-top: 1px solid var(--line); background: none; border-left: 0; border-right: 0; border-bottom: 0; width: 100%; text-align: left; }
.item:first-child { border-top: 0; }
.thumb { width: 52px; height: 52px; border-radius: 12px; flex: none; display: grid; place-items: center; font: 800 13px/1 var(--display); letter-spacing: .04em; color: var(--accent-ink); background: var(--accent-soft); position: relative; overflow: hidden; text-transform: uppercase; }
.thumb::after { content: ""; position: absolute; right: 5px; bottom: 5px; border-left: 8px solid currentColor; border-top: 5px solid transparent; border-bottom: 5px solid transparent; opacity: .7; }
.thumb[data-img] { background-size: cover; background-position: center; color: transparent; border: 0; }
.thumb[data-img]::after { color: #fff; opacity: 1; filter: drop-shadow(0 0 3px rgba(0,0,0,.6)); right: 50%; bottom: 50%; transform: translate(50%, 50%); border-left-width: 12px; border-top-width: 8px; border-bottom-width: 8px; }
.player { position: relative; aspect-ratio: 16 / 9; max-width: 100%; border-radius: 14px; overflow: hidden; background: #000; }
.player.tall { aspect-ratio: 9 / 16; max-height: 62vh; margin: 0 auto; }
.player iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
.credit a { color: inherit; font-weight: 700; }
.item .grow { flex: 1; min-width: 0; }
.item .name { font-weight: 800; }
.item .sub { color: var(--muted); font-size: 12.5px; }

/* Workout logger */
.ex { padding: 14px; }
.ex-head { display: flex; gap: 12px; align-items: flex-start; }
.sets { display: grid; gap: 8px; margin-top: 12px; }
.set { display: grid; grid-template-columns: 26px 1fr 1fr auto; gap: 8px; align-items: center; }
.set .n { font: 800 16px/1 var(--display); color: var(--muted); text-align: center; }
.set input { width: 100%; min-width: 0; border: 1px solid var(--line); background: var(--raised); border-radius: 10px; padding: 8px 10px; font-weight: 800; }
.set label { font-size: 10px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); display: block; margin-bottom: 2px; }
.effort { display: flex; gap: 4px; }
.effort button { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 6px 6px; font-size: 10.5px; font-weight: 800; }
.effort button.on { background: var(--heat); border-color: var(--heat); color: #fff; }
.set.logged input { border-color: var(--ok); }
.last { font-size: 12px; color: var(--muted); }
.coachtip { margin-top: 10px; border-radius: 12px; padding: 10px 12px; font-size: 13px; font-weight: 700; background: var(--ok-soft); color: var(--ok); }
.coachtip.hold { background: var(--accent-soft); color: var(--accent-ink); }
.coachtip.drop { background: var(--heat-soft); color: var(--heat); }

/* Sheets */
.scrim { position: fixed; inset: 0; background: rgba(8, 10, 14, .5); z-index: 40; display: flex; align-items: flex-end; justify-content: center; }
.sheet { background: var(--surface); width: 100%; max-width: 440px; border-radius: 22px 22px 0 0; padding: 18px max(16px, env(safe-area-inset-right, 0px)) calc(22px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); max-height: 88vh; overflow: auto; }
.grab-zone { position: relative; display: flex; justify-content: center; align-items: center; min-height: 34px; margin: -10px 0 6px; touch-action: none; cursor: grab; }
.grab-zone:active { cursor: grabbing; }
.grab { width: 44px; height: 5px; border-radius: 3px; background: var(--muted); opacity: .5; }
.sheet-x { position: absolute; right: 0; top: 0; width: 34px; height: 34px; border-radius: 50%; border: 1px solid var(--line); background: var(--raised); font-size: 18px; line-height: 1; display: grid; place-items: center; }
.sheet { animation: sheetIn .22s ease-out; will-change: transform; }
@keyframes sheetIn { from { transform: translateY(40%); opacity: .4; } to { transform: none; opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .sheet { animation: none; } }
.video { display: flex; gap: 12px; align-items: center; border-radius: 14px; background: var(--hero); color: var(--on-hero); padding: 14px; text-decoration: none; }
.video .play { width: 46px; height: 46px; border-radius: 50%; background: var(--accent); display: grid; place-items: center; flex: none; }
.video .play::before { content: ""; border-left: 14px solid #0d0d0d; border-top: 9px solid transparent; border-bottom: 9px solid transparent; margin-left: 4px; }
.video .vt { font-weight: 800; font-size: 13.5px; }
.video .vc { font-size: 12px; opacity: .75; }
.chain { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; font-size: 12.5px; }
.chain .lv { border: 1px solid var(--line); border-radius: 999px; padding: 4px 10px; font-weight: 700; background: var(--raised); }
.chain .lv.me { background: var(--accent); color: var(--on-accent); border-color: transparent; }
.cues { margin: 0; padding-left: 18px; display: grid; gap: 4px; }

/* Tabs */
.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; background: color-mix(in srgb, var(--surface) 92%, transparent); backdrop-filter: blur(10px); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); }
.tabs .in { max-width: 440px; margin: 0 auto; display: grid; grid-template-columns: repeat(5, 1fr); padding-left: max(8px, env(safe-area-inset-left, 0px)); padding-right: max(8px, env(safe-area-inset-right, 0px)); }
.tabs button { background: none; border: 0; padding: 10px 0 12px; font-size: 11px; font-weight: 800; color: var(--muted); display: grid; justify-items: center; gap: 4px; }
.tabs button svg { width: 22px; height: 22px; }
.tabs button.on { color: var(--accent-ink); }

/* Rings and charts */
.rings { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.ring { text-align: center; font-size: 11.5px; font-weight: 700; color: var(--muted); }
.ring svg { width: 100%; max-width: 76px; height: auto; display: block; margin: 0 auto 4px; }
.ring b { display: block; color: var(--ink); font-size: 13px; }
.chart { width: 100%; height: auto; display: block; }
.stat { display: grid; gap: 2px; }
.stat .v { font: 800 24px/1.05 var(--display); }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }

/* Onboarding */
.q { display: grid; gap: 8px; padding: 12px 0; border-top: 1px solid var(--line); }
.q:first-of-type { border-top: 0; }
.yn { display: flex; gap: 8px; }
.yn button { flex: 1; border: 1px solid var(--line); background: var(--raised); border-radius: 10px; padding: 9px; font-weight: 800; }
.yn button.on.no { background: var(--ok); border-color: var(--ok); color: #fff; }
.yn button.on.yes { background: var(--heat); border-color: var(--heat); color: #fff; }
.steps { display: flex; gap: 4px; margin: 4px 0 14px; }
.steps span { flex: 1; height: 5px; border-radius: 3px; background: var(--line); }
.steps span.on { background: var(--accent); }
.field { display: grid; gap: 6px; }
.field > span { font-size: 12px; font-weight: 800; color: var(--muted); letter-spacing: .04em; }
.field textarea { border: 1px solid var(--line); background: var(--raised); border-radius: 12px; padding: 10px 12px; font: inherit; font-weight: 600; color: var(--ink); width: 100%; resize: vertical; }
.photo-in { display: grid; place-items: center; aspect-ratio: 3 / 4; border: 1.5px dashed var(--line); border-radius: 12px; font-size: 12px; font-weight: 800; color: var(--muted); cursor: pointer; overflow: hidden; text-align: center; padding: 4px; }
.photo-in img { width: 100%; height: 100%; object-fit: cover; }
.btn[disabled] { opacity: .45; cursor: not-allowed; }
.field input, .field select { border: 1px solid var(--line); background: var(--raised); border-radius: 12px; padding: 11px 12px; font-weight: 700; width: 100%; }
.alert { border-radius: 14px; padding: 12px 14px; background: var(--heat-soft); color: var(--heat); font-weight: 700; font-size: 13.5px; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(86px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 999px; font-weight: 800; font-size: 13px; z-index: 60; }
.tier { border: 1px solid var(--line); border-radius: 16px; padding: 14px; display: grid; gap: 6px; background: var(--surface); }
.tier.on { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); }
.msg { background: var(--raised); border-radius: 14px 14px 14px 4px; padding: 10px 12px; font-size: 14px; }
.msg.me { background: var(--accent); color: var(--on-accent); border-radius: 14px 14px 4px 14px; justify-self: end; }
.scan { border-radius: 18px; background: var(--hero); color: var(--on-hero); aspect-ratio: 4 / 3; max-width: 100%; display: grid; place-items: center; position: relative; overflow: hidden; }
.scan .frame { width: 70%; height: 38%; border: 3px solid var(--accent); border-radius: 12px; position: relative; }
.scan .laser { position: absolute; left: 6%; right: 6%; height: 2px; background: var(--heat); top: 50%; box-shadow: 0 0 12px var(--heat); animation: laser 1.6s ease-in-out infinite alternate; }
@keyframes laser { from { top: 15%; } to { top: 85%; } }
.credit { font-size: 11px; color: var(--muted); }
@media (prefers-reduced-motion: reduce) { .scan .laser { animation: none; } }

/* ===== V2: Ladder-style workout side, MacroFactor-style food side ===== */
:root { --c-kcal: #f69f00; --c-p: #2f6fe4; --c-f: #d9415a; --c-c: #1f9d6b; --track: color-mix(in srgb, var(--ink) 10%, transparent); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --c-p: #6ea0ff; --c-f: #ff7a8f; --c-c: #4fd19c; } }
:root[data-theme="dark"] { --c-p: #6ea0ff; --c-f: #ff7a8f; --c-c: #4fd19c; }
.gold { color: var(--accent); }
.btn.gold { background: var(--accent); color: #0d0d0d; border-color: transparent; }
.btn.big { min-height: 56px; font-size: 15px; }
.app { padding-bottom: 130px; }
.toast { width: max-content; max-width: calc(100vw - 32px); text-align: center; }
.tabs .in { grid-template-columns: repeat(5, 1fr); }
.sec-h { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; margin: 6px 0 -2px; }
.sec-h h3 { font: 900 15px/1.1 var(--display); text-transform: uppercase; letter-spacing: .03em; }

/* Today: team avatars, week strip, full-bleed workout card */
.teamrow { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
.faces { display: flex; }
.faces span { width: 34px; height: 34px; border-radius: 50%; border: 2px solid var(--bg); margin-left: -8px; display: grid; place-items: center; font: 800 11px/1 var(--display); color: #0d0d0d; }
.faces span:first-child { margin-left: 0; }
.wstrip { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; margin-bottom: 12px; }
.wd { display: grid; justify-items: center; gap: 3px; padding: 6px 0 8px; border-radius: 14px; font-size: 11px; font-weight: 700; color: var(--muted); }
.wd b { font: 800 16px/1 var(--display); color: var(--ink); }
.wd i { width: 18px; height: 18px; border-radius: 50%; display: grid; place-items: center; font-style: normal; }
.wd.done i { background: var(--accent); color: #0d0d0d; }
.wd.done i svg { width: 12px; height: 12px; }
.wd.now { background: var(--hero); color: var(--accent); border: 1px solid var(--line); }
.wd.now b { color: var(--on-hero); }
.wd.now i { border: 2px solid var(--accent); }
.wd.rest b { color: var(--muted); font-weight: 600; }
.wd.plan i { border: 2px solid var(--line); }
.hero { position: relative; border-radius: 24px; overflow: hidden; background: #0b0b0b; color: #fff; min-height: 380px; display: flex; align-items: flex-end; border: 1px solid var(--line); }
.hero::before { content: ""; position: absolute; inset: 0; background: radial-gradient(120% 70% at 85% 10%, rgba(246,159,0,.38), transparent 60%), radial-gradient(90% 60% at 0% 100%, rgba(166,166,166,.18), transparent 70%); }
.hero .mark { position: absolute; right: -40px; top: -10px; width: 250px; height: 250px; opacity: .22; background-size: contain; background-repeat: no-repeat; transform: rotate(-8deg); }
.hero-in { position: relative; padding: 20px; width: 100%; }
.hero-title { font: 900 44px/.95 var(--display); text-transform: uppercase; letter-spacing: -.02em; margin: 6px 0 10px; }
.hero-meta { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 13.5px; font-weight: 700; color: #d9d9d9; }
.hero-meta span + span::before { content: "·"; margin-right: 14px; color: var(--accent); }
.hero-eq { display: flex; flex-wrap: wrap; gap: 6px; margin: 12px 0 16px; }
.hero-eq span { border: 1px solid rgba(255,255,255,.22); border-radius: 999px; padding: 4px 10px; font-size: 11.5px; font-weight: 800; text-transform: capitalize; }
.hero .btn.ghost { color: #fff; border-color: rgba(255,255,255,.3); }
.bar { height: 10px; border-radius: 6px; background: var(--track); overflow: hidden; }
.bar > i { display: block; height: 100%; border-radius: 6px; background: var(--accent); }
.flame { display: inline-flex; align-items: center; gap: 6px; font: 900 22px/1 var(--display); }
.flame svg { width: 22px; height: 22px; color: var(--accent); }

/* Workout preview */
.pv-hero { margin: 0 -16px; padding: 18px 16px 20px; background: #0b0b0b; color: #fff; position: relative; overflow: hidden; border-radius: 0 0 26px 26px; }
.pv-hero::before { content: ""; position: absolute; inset: 0; background: radial-gradient(100% 80% at 100% 0%, rgba(246,159,0,.35), transparent 60%); }
.pv-hero > * { position: relative; }
.backbtn { background: rgba(255,255,255,.12); color: #fff; border: 0; border-radius: 999px; padding: 8px 14px; font-weight: 800; font-size: 13px; }
.block-h { display: flex; justify-content: space-between; align-items: baseline; padding: 14px 0 4px; }
.block-h b { font: 900 14px/1 var(--display); text-transform: uppercase; letter-spacing: .06em; }
.mv { display: flex; gap: 12px; align-items: center; padding: 10px 0; border-top: 1px solid var(--line); }
.mv:first-child { border-top: 0; }
.mv .grow { flex: 1; min-width: 0; text-align: left; background: none; border: 0; padding: 0; }
.mv .name { font-weight: 800; display: block; }
.mv .sub { color: var(--muted); font-size: 12.5px; }
.sticky-go { position: fixed; left: 0; right: 0; bottom: 0; z-index: 35; padding: 12px max(16px, env(safe-area-inset-right, 0px)) calc(14px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); background: linear-gradient(to top, var(--bg) 70%, transparent); }
.sticky-go > div { max-width: 408px; margin: 0 auto; }

/* Full-screen player */
#player:empty { display: none; }
.pv { position: fixed; inset: 0; z-index: 70; background: #000; color: #fff; display: flex; flex-direction: column; }
.pv-wrap { width: 100%; max-width: 440px; margin: 0 auto; height: 100%; display: flex; flex-direction: column; overflow: auto; overscroll-behavior: contain; }
.pv-top { padding: calc(8px + env(safe-area-inset-top, 0px)) 14px 8px; }
.pv-seg { display: flex; gap: 2px; }
.pv-seg i { flex: 1; height: 4px; border-radius: 2px; background: rgba(255,255,255,.22); }
.pv-seg i.d { background: var(--accent); }
.pv-seg i.c { background: #fff; }
.pv-bar { display: flex; align-items: center; justify-content: space-between; margin-top: 8px; font-weight: 800; font-size: 13px; color: #cfcfcf; }
.pv-x { width: 36px; height: 36px; border-radius: 50%; background: rgba(255,255,255,.14); border: 0; color: #fff; font-size: 20px; line-height: 1; }
.pv-video { position: relative; aspect-ratio: 16 / 10; background: #111; flex: none; }
.pv-video iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
.pv-novid { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; padding: 16px; background: radial-gradient(80% 80% at 50% 30%, #2a2112, #0b0b0b); }
.pv-novid .big { font: 900 54px/1 var(--display); color: var(--accent); }
.pv-novid a { color: #fff; font-weight: 800; font-size: 13px; }
.pv-body { padding: 16px 16px calc(18px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 12px; }
.pv-eyebrow { font: 800 11px/1 var(--body); letter-spacing: .14em; text-transform: uppercase; color: var(--accent); }
.pv-name { font: 900 28px/1.02 var(--display); text-transform: uppercase; letter-spacing: -.01em; }
.pv-setline { font-size: 14px; color: #d6d6d6; }
.pv-setline b { color: #fff; font: 900 16px/1 var(--display); text-transform: uppercase; }
.pv-last { font-size: 12.5px; color: #a6a6a6; }
.pv-steppers { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.stepper { background: #151515; border: 1px solid #2b2b2b; border-radius: 16px; padding: 10px; display: grid; gap: 6px; }
.stepper > span { font-size: 10.5px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; color: #a6a6a6; text-align: center; }
.stepper > div { display: grid; grid-template-columns: 38px 1fr 38px; align-items: center; gap: 4px; }
.stepper button { width: 38px; height: 38px; border-radius: 50%; border: 0; background: #262626; color: #fff; font-size: 20px; font-weight: 800; }
.stepper input { width: 100%; min-width: 0; background: transparent; border: 0; color: #fff; text-align: center; font: 900 28px/1 var(--display); padding: 0; }
.feel { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.feel button { border: 1px solid #333; background: #151515; color: #fff; border-radius: 12px; padding: 10px 2px; font-size: 12.5px; font-weight: 800; }
.feel button.on { background: var(--accent); border-color: var(--accent); color: #0d0d0d; }
.pv-ctrl { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 8px; }
.pv-ctrl button { background: none; border: 0; color: #cfcfcf; font-weight: 800; font-size: 13px; padding: 10px 4px; }
.pv-ctrl button:last-child { text-align: right; }
.pv-ctrl .round { width: 64px; height: 64px; border-radius: 50%; background: #fff; color: #000; display: grid; place-items: center; padding: 0; }
.pv-ctrl .round svg { width: 26px; height: 26px; }
.clock { position: relative; width: 190px; height: 190px; margin: 4px auto 0; }
.clock svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.clock .t { position: absolute; inset: 0; display: grid; place-items: center; align-content: center; font: 900 52px/1 var(--display); }
.clock .t small { display: block; font: 800 11px/1.6 var(--body); letter-spacing: .14em; color: #a6a6a6; text-align: center; }
.upnext { display: flex; gap: 12px; align-items: center; background: #151515; border: 1px solid #2b2b2b; border-radius: 16px; padding: 10px; }
.upnext .thumb { width: 56px; height: 56px; }
.pv .coachtip { margin-top: 0; }
.pv-done { text-align: center; display: grid; gap: 12px; justify-items: center; padding-top: 18px; }
.okcheck { width: 76px; height: 76px; border-radius: 50%; background: #b6f04a; color: #0d0d0d; display: grid; place-items: center; }
.okcheck svg { width: 40px; height: 40px; }
.pv-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; width: 100%; }
.pv-stats div { background: #151515; border: 1px solid #2b2b2b; border-radius: 16px; padding: 12px 6px; }
.pv-stats b { display: block; font: 900 24px/1.1 var(--display); }
.pv-stats span { font-size: 11px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; color: #a6a6a6; }
.stars { display: flex; gap: 6px; justify-content: center; }
.stars button { background: none; border: 0; padding: 2px; color: #444; }
.stars button.on { color: var(--accent); }
.stars svg { width: 34px; height: 34px; }
.streakdots { display: flex; gap: 6px; justify-content: center; }
.streakdots i { width: 26px; height: 26px; border-radius: 50%; border: 2px solid #333; display: grid; place-items: center; font-style: normal; }
.streakdots i.on { background: var(--accent); border-color: var(--accent); color: #0d0d0d; }
.streakdots i svg { width: 14px; height: 14px; }

/* Journal */
.cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; text-align: center; font-size: 12px; }
.cal .h { font-size: 10.5px; font-weight: 800; color: var(--muted); letter-spacing: .08em; }
.cal span { aspect-ratio: 1; display: grid; place-items: center; border-radius: 50%; font-weight: 700; color: var(--muted); }
.cal span.done { background: var(--accent); color: #0d0d0d; font-weight: 900; }
.cal span.today { box-shadow: inset 0 0 0 2px var(--accent); color: var(--ink); }
.badges { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.badge { text-align: center; font-size: 11px; font-weight: 800; line-height: 1.25; }
.badge svg { width: 100%; max-width: 64px; height: auto; display: block; margin: 0 auto 4px; }
.badge.off { opacity: .4; }
.lift { display: grid; grid-template-columns: 1fr 108px; gap: 10px; align-items: center; padding: 12px 0; border-top: 1px solid var(--line); }
.lift:first-child { border-top: 0; }
.lift b { display: block; }
.lift .big { font: 900 22px/1.1 var(--display); }
details.more > summary { cursor: pointer; font-weight: 800; list-style: none; display: flex; justify-content: space-between; }
details.more > summary::after { content: "+"; font-size: 20px; line-height: 1; color: var(--muted); }
details.more[open] > summary::after { content: "−"; }

/* Food (MacroFactor style) */
.datebar { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; margin-bottom: 10px; }
.datebar button { border: 0; background: none; border-radius: 12px; padding: 6px 0; display: grid; justify-items: center; gap: 2px; font-size: 11px; font-weight: 700; color: var(--muted); }
.datebar button b { font: 800 15px/1 var(--display); color: var(--ink); }
.datebar button.on { background: var(--ink); color: var(--bg); }
.datebar button.on b { color: var(--bg); }
.hat { display: grid; grid-auto-flow: column; grid-auto-columns: 100%; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; gap: 12px; }
.hat::-webkit-scrollbar { display: none; }
.hat > section { scroll-snap-align: start; min-width: 0; }
.hatdots { display: flex; justify-content: center; gap: 6px; margin-top: 8px; }
.hatdots i { width: 6px; height: 6px; border-radius: 3px; background: var(--line); transition: width .2s; }
.hatdots i.on { width: 18px; background: var(--ink); }
.seg { display: inline-flex; background: var(--raised); border: 1px solid var(--line); border-radius: 999px; padding: 2px; }
.seg button { border: 0; background: none; border-radius: 999px; padding: 4px 10px; font-size: 12px; font-weight: 800; color: var(--muted); }
.seg button.on { background: var(--ink); color: var(--bg); }
.bignum { font: 900 40px/1 var(--display); margin: 10px 0 2px; }
.bignum small { font: 700 14px/1 var(--body); color: var(--muted); margin-left: 4px; }
.mbar { display: grid; gap: 4px; margin-top: 10px; }
.mbar .row { font-size: 12.5px; }
.mbar .row b { font-weight: 800; }
.mtrack { position: relative; height: 10px; border-radius: 5px; background: var(--track); overflow: hidden; }
.mtrack > i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 5px; }
.mtrack > i.add { opacity: .45; }
.wk { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; align-items: end; height: 120px; margin-top: 10px; position: relative; }
.wk .col { display: grid; justify-items: center; gap: 4px; height: 100%; align-content: end; font-size: 10.5px; font-weight: 800; color: var(--muted); border-radius: 10px; padding: 4px 0; }
.wk .col.on { box-shadow: inset 0 0 0 1.5px var(--ink); color: var(--ink); }
.wk .col i { width: 60%; border-radius: 5px 5px 2px 2px; background: var(--c-kcal); display: block; }
.wk .col i.light { opacity: .35; }
.wk .tl { position: absolute; left: 0; right: 0; border-top: 2px dashed var(--ink); opacity: .5; }
.strategy { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; text-align: center; margin-top: 10px; }
.strategy b { display: block; font: 900 19px/1.1 var(--display); }
.strategy span { font-size: 11px; font-weight: 800; color: var(--muted); }
.dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--accent); margin-right: 6px; vertical-align: middle; }
.tl-wrap { padding: 4px 0; }
.hr { display: grid; grid-template-columns: 52px 1fr 34px; gap: 6px; align-items: start; border-top: 1px solid var(--line); min-height: 36px; padding: 6px 0; position: relative; }
.hr .hl { font-size: 11.5px; font-weight: 800; color: var(--muted); padding-top: 4px; }
.hr.now { border-top: 2px solid var(--accent); }
.hr.now .hl { color: var(--accent-ink); }
.hadd { width: 30px; height: 30px; border-radius: 50%; border: 1px solid var(--line); background: var(--raised); font-size: 17px; font-weight: 800; line-height: 1; color: var(--muted); }
.fe { display: flex; gap: 8px; align-items: center; width: 100%; text-align: left; background: none; border: 0; padding: 4px 0; }
.fe .grow { flex: 1; min-width: 0; }
.fe .name { font-weight: 700; font-size: 14px; display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.fe .sub { font-size: 12px; color: var(--muted); }
.mdot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin: 0 3px 1px 0; }
.fab { position: fixed; z-index: 34; right: max(18px, calc(50% - 202px)); bottom: calc(84px + env(safe-area-inset-bottom, 0px)); width: 60px; height: 60px; border-radius: 50%; border: 0; background: var(--accent); color: #0d0d0d; font-size: 32px; font-weight: 700; line-height: 1; box-shadow: 0 8px 22px rgba(0,0,0,.28); }

/* Food logger sheet */
.sheet.full { height: 92vh; display: flex; flex-direction: column; }
.ribbon { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin: 10px 0; }
.ribbon button { border: 1px solid var(--line); background: var(--raised); border-radius: 14px; padding: 9px 2px 8px; display: grid; justify-items: center; gap: 4px; font-size: 11.5px; font-weight: 800; color: var(--muted); }
.ribbon button svg { width: 20px; height: 20px; }
.ribbon button.on { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.plate { border: 1.5px solid var(--accent); border-radius: 16px; padding: 10px 12px; background: var(--accent-soft); display: grid; gap: 8px; }
.plate .chips span { display: inline-flex; gap: 6px; align-items: center; border-radius: 999px; background: var(--surface); border: 1px solid var(--line); padding: 3px 4px 3px 10px; font-size: 12px; font-weight: 700; max-width: 100%; }
.plate .chips span em { font-style: normal; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 150px; }
.plate .chips button { border: 0; background: var(--raised); width: 22px; height: 22px; border-radius: 50%; font-size: 13px; line-height: 1; }
.daybanner { border-radius: 14px; background: var(--raised); padding: 8px 12px; font-size: 12.5px; font-weight: 700; color: var(--muted); }
.fr { display: flex; gap: 10px; align-items: center; border-top: 1px solid var(--line); padding: 10px 0; }
.fr:first-child { border-top: 0; }
.fr .fr-main { flex: 1; min-width: 0; text-align: left; background: none; border: 0; padding: 0; }
.fr .name { font-weight: 700; display: block; }
.fr .sub { font-size: 12px; color: var(--muted); }
.plus { width: 34px; height: 34px; border-radius: 50%; border: 0; background: var(--accent); color: #0d0d0d; font-size: 20px; font-weight: 800; line-height: 1; flex: none; }
.grouph { font-size: 11px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); padding: 10px 0 2px; }
.lg-scroll { flex: 1; overflow: auto; min-height: 0; }
.amt { display: grid; grid-template-columns: 46px 1fr 46px; gap: 8px; align-items: center; }
.amt input { text-align: center; font: 900 24px/1 var(--display); border: 1px solid var(--line); background: var(--raised); border-radius: 12px; padding: 8px; width: 100%; min-width: 0; color: var(--ink); }
.amt button { height: 46px; border-radius: 12px; border: 1px solid var(--line); background: var(--raised); font-size: 20px; font-weight: 800; }
.cichart { width: 100%; height: auto; display: block; }
.cmp { display: grid; grid-template-columns: 1fr auto auto auto; gap: 6px 12px; align-items: center; font-size: 14px; }
.cmp .h { font-size: 11px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
