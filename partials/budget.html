<fieldset class="pills">
  <legend>What range fits your project? (optional)</legend>
  <div class="pill-row">
    <label class="pill"><input type="radio" name="budget" value="Under $5k" /><span>Under $5k</span></label>
    <label class="pill"><input type="radio" name="budget" value="$5k – $15k" /><span>$5k – $15k</span></label>
    <label class="pill"><input type="radio" name="budget" value="$15k – $25k" /><span>$15k – $25k</span></label>
    <label class="pill"><input type="radio" name="budget" value="$25k – $40k" /><span>$25k – $40k</span></label>
    <label class="pill"><input type="radio" name="budget" value="$40k – $75k" /><span>$40k – $75k</span></label>
    <label class="pill"><input type="radio" name="budget" value="$75k+" /><span>$75k+</span></label>
    <label class="pill"><input type="radio" name="budget" value="Not sure yet" /><span>Not sure yet</span></label>
  </div>
</fieldset>
