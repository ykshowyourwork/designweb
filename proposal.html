<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="robots" content="noindex, nofollow" />
<title>Growth proposal · DesiWeb</title>
<meta name="theme-color" content="#0f1115" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=JetBrains+Mono:wght@500;700&display=swap" />
<style>
  :root { --bg:#0f1115; --card:#181b22; --line:#2c3140; --text:#f4f2ec; --muted:#c9c6bd; --dim:#8a877f; --blue:#1f5eff; --sky:#8fb0ff; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 18px/1.5 Inter, Arial, sans-serif; }
  .deck { height: 100svh; overflow-y: auto; scroll-snap-type: y mandatory; scroll-behavior: smooth; }
  .slide { min-height: 100svh; scroll-snap-align: start; padding: clamp(28px, 7vw, 96px); padding-bottom: clamp(70px, 9vw, 110px); display: flex; flex-direction: column; justify-content: center; gap: clamp(20px, 3vw, 40px); position: relative; }
  .slide.cover, .slide.next { background: radial-gradient(circle at 85% 20%, #1c3a8a 0%, var(--bg) 55%); }
  .slide.money { background: var(--blue); color: #f7f8ff; }
  .slide.light { background: #f4f2ec; color: #0f1115; }
  .eyebrow { font: 700 clamp(13px, 1.5vw, 18px)/1.2 "JetBrains Mono", monospace; color: var(--sky); letter-spacing: 2px; text-transform: uppercase; margin: 0; }
  .light .eyebrow { color: var(--blue); } .money .eyebrow { color: #dfe6ff; }
  h1 { font-size: clamp(2.6rem, 8vw, 6.4rem); font-weight: 800; line-height: 1.02; letter-spacing: -0.04em; margin: 0; }
  h2 { font-size: clamp(1.8rem, 4.6vw, 3.6rem); font-weight: 800; letter-spacing: -0.03em; line-height: 1.08; margin: 0; max-width: 1200px; }
  p.big { font-size: clamp(1.1rem, 2.4vw, 1.9rem); color: var(--muted); max-width: 1100px; margin: 0; line-height: 1.35; }
  .light p.big { color: #4a4f58; } .money p.big { color: #f7f8ff; }
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 18px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 22px; padding: clamp(20px, 2.4vw, 36px); }
  .light .card { background: #fbfaf6; border-color: #dcd8cc; }
  .card h3 { margin: 0 0 8px; font-size: clamp(1.1rem, 1.8vw, 1.6rem); }
  .card p { margin: 0; color: var(--muted); font-size: clamp(.95rem, 1.4vw, 1.2rem); }
  .light .card p { color: #4a4f58; }
  .card.hi { border: 2px solid #4f86ff; }
  .num { font-size: clamp(2.6rem, 7vw, 5.6rem); font-weight: 800; letter-spacing: -0.04em; line-height: 1; }
  table { width: 100%; max-width: 1200px; border-collapse: collapse; font-size: clamp(.95rem, 1.6vw, 1.35rem); }
  th { text-align: left; color: var(--dim); font-weight: 600; padding: 10px 12px; border-bottom: 1px solid var(--line); }
  td { padding: 12px; border-bottom: 1px solid var(--line); }
  tr.you td { color: #8fb0ff; font-weight: 700; }
  ol, ul { margin: 0; padding-left: 1.2em; font-size: clamp(1.05rem, 2vw, 1.6rem); line-height: 1.6; max-width: 1100px; }
  a.link { color: #f0c75e; font-weight: 800; font-size: clamp(1.3rem, 3.6vw, 3rem); word-break: break-all; }
  .foot { position: absolute; left: clamp(28px, 7vw, 96px); right: clamp(28px, 7vw, 96px); bottom: clamp(20px, 3vw, 40px); font-size: 14px; color: var(--dim); }
  .money .foot { color: #dfe6ff; }
  .nav { position: fixed; right: 16px; bottom: 16px; display: flex; gap: 8px; z-index: 5; }
  .nav button { width: 46px; height: 46px; border-radius: 50%; border: 1px solid var(--line); background: rgba(24,27,34,.9); color: #fff; font-size: 20px; cursor: pointer; }
  .count { position: fixed; left: 16px; bottom: 22px; font: 600 13px "JetBrains Mono", monospace; color: var(--dim); z-index: 5; }
  .loading { position: fixed; inset: 0; display: grid; place-items: center; color: var(--dim); background: var(--bg); }
  .loading[hidden] { display: none; }
  .table-blank td:last-child { color: var(--dim); }
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<div class="count" id="count"></div>
<div class="nav"><button type="button" id="prev" aria-label="Previous slide">↑</button><button type="button" id="next" aria-label="Next slide">↓</button></div>
<div class="loading" id="loading">Loading the proposal…</div>
<script type="module" src="/src/proposal.js"></script>
</body>
</html>
